[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "agentic-ai"
version = "0.1.0"
description = "Local agentic AI project using Ollama, Pydantic AI and Playwright"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-ai>=2.44,<3",
    "playwright>=1.50,<2"
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "ipykernel"
]


[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"